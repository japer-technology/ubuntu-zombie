name: Beep Release

# Beep owns an independent version, tag namespace, artifact, SBOM,
# provenance, signatures, and release despite sharing this repository.

on:
  push:
    branches:
      - main
    paths:
      - products/beep/VERSION
    tags:
      - "beep-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Beep tag to release (must already exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build independent Beep release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve product version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < products/beep/VERSION)"
          [[ "${version}" =~ ^[0-9]{4}(\.[0-9]{2}){5}$ ]] || {
            echo "::error::Beep VERSION is invalid." >&2
            exit 1
          }
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME:-}"
          fi
          if [[ -z "${tag}" ]]; then
            tag="beep-v${version}"
          fi
          if [[ "${tag}" != "beep-v${version}" ]]; then
            echo "::error::Tag ${tag} does not match Beep VERSION ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate and package Beep
        run: |
          make -C products/beep lint PYTHON=python3
          make -C products/beep test PYTHON=python3
          make -C products/beep package
          mkdir -p /tmp/beep-sbom
          tar -xzf \
            "products/beep/dist/beep-${{ steps.meta.outputs.version }}.tar.gz" \
            -C /tmp/beep-sbom
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = "${{ steps.meta.outputs.version }}"
          evidence = {
              "schema_version": 1,
              "product_id": "beep",
              "version": version,
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "lint": "passed",
              "unit_integration_and_parity_tests": "passed",
              "package": "passed",
              "standalone_vm": "not_run",
              "coinstallation": "not_run",
          }
          path = Path("products/beep/dist")
          (path / f"beep-{version}.test-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate product SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: /tmp/beep-sbom
          format: spdx-json
          output-file: products/beep/dist/beep-${{ steps.meta.outputs.version }}.spdx.json

      - name: Compute release checksums
        working-directory: products/beep/dist
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          sha256sum -- \
            "beep-${version}.tar.gz" \
            "beep-${version}.spdx.json" \
            "beep-${version}.test-evidence.json" \
            > "beep-${version}.sha256"
          cat "beep-${version}.sha256"

      - name: Generate product provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.2.0
        with:
          subject-checksums: products/beep/dist/beep-${{ steps.meta.outputs.version }}.sha256

      - name: Stage provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "products/beep/dist/beep-${{ steps.meta.outputs.version }}.intoto.jsonl"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign every Beep release asset
        working-directory: products/beep/dist
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for file in \
            *.tar.gz *.sha256 *.spdx.json *.test-evidence.json *.intoto.jsonl; do
            cosign sign-blob --yes "${file}" \
              --bundle "${file}.cosign.bundle" \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem"
          done

      - name: Upload Beep release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: beep-release-artifacts
          path: products/beep/dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish independent Beep release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/beep-v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Beep release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: beep-release-artifacts
          path: products/beep/dist

      - name: Ensure product release tag exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            existing_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${RELEASE_TAG} already points elsewhere." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Build product release notes
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          if grep -qE "^## \\[?${version}\\]?" products/beep/CHANGELOG.md; then
            awk -v ver="${version}" '
              $0 ~ "^## \\[?" ver "\\]?" {found=1; next}
              found && /^## / {exit}
              found {print}
            ' products/beep/CHANGELOG.md > release-notes.md
          else
            printf '%s\n' "Beep ${version}." > release-notes.md
          fi
          {
            echo
            echo "This is an independent Beep product release."
            echo "Verify the checksum and cosign bundle before installation."
          } >> release-notes.md

      - name: Create product GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Beep ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: products/beep/dist/*
